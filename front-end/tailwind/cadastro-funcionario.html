<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoceGestão — Entrar</title>

<!-- Fontes do Google Fonts: Fraunces (logo/títulos) e Inter (texto) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/output.css">

<!--ajuste de fonte padrão do body (fora do Tailwind) -->
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
</style>
</head>
<body class="bg-cream min-h-screen flex items-center justify-center p-4">

  <!-- Cartão central: centraliza o login na tela e dá o rounded-2xl + sombra -->
  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl shadow-cocoa-800/5 overflow-hidden flex flex-col md:flex-row">

    <!-- Painel esquerdo: imagem de fundo + frase de efeito (some no celular, some via flex-col md:flex-row) -->
    <div class="relative md:w-[45%] min-h-[220px] md:min-h-[560px] bg-cocoa-800 flex items-end p-8"
         style="background-image: linear-gradient(180deg, rgba(74,46,26,0.25) 0%, rgba(74,46,26,0.85) 100%), url('https://images.unsplash.com/photo-1558326567-98ae2405596b?q=80&w=800&auto=format&fit=crop'); background-size: cover; background-position: center;">
      <div class="relative z-10 text-cream">
        <p class="font-display italic text-xl md:text-2xl leading-snug">
          A doçura de uma<br>gestão eficiente.
        </p>
        <p class="mt-3 text-sm text-cream/70">
          Estoque, pedidos e fornecedores da sua doceria, tudo em um só lugar.
        </p>
      </div>
    </div>

    <!-- Painel direito: formulário de login -->
    <div class="md:w-[55%] px-8 py-10 md:px-12 md:py-14 flex flex-col justify-center">

      <!--(painel do admin) -->
      <div class="mb-8">
        <h1 class="font-display text-3xl text-cocoa-700">DoceGestão</h1>
        <span class="inline-block mt-2 text-xs font-medium text-rose-500 bg-rose-100 px-2.5 py-1 rounded-full">
          Painel do administrador
        </span>
      </div>

      <h2 class="text-lg font-semibold text-cocoa-800 mb-1">Bem-vindo de volta</h2>
      <p class="text-sm text-cocoa-400 mb-8">Entre com sua conta para continuar.</p>

      <!-- Formulário: e-mail, senha (com botão mostrar/ocultar), lembrar-me / esqueci a senha, botão entrar -->
      <form class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-cocoa-700 mb-1.5">E-mail</label>
          <input type="email" id="email" placeholder="seu@docegestao.com"
            class="w-full rounded-lg border border-cocoa-200 bg-cream/40 px-4 py-2.5 text-sm text-cocoa-800 placeholder:text-cocoa-400/70 focus:outline-none focus:ring-2 focus:ring-cocoa-400 focus:border-transparent">
        </div>

        <div>
          <label for="senha" class="block text-sm font-medium text-cocoa-700 mb-1.5">Senha</label>
          <div class="relative">
            <input type="password" id="senha" placeholder="••••••••"
              class="w-full rounded-lg border border-cocoa-200 bg-cream/40 px-4 py-2.5 text-sm text-cocoa-800 placeholder:text-cocoa-400/70 focus:outline-none focus:ring-2 focus:ring-cocoa-400 focus:border-transparent">
            <!-- Alterna o type do input entre password/text pra mostrar ou ocultar a senha -->
            <button type="button" onclick="const i=document.getElementById('senha'); i.type = i.type==='password' ? 'text' : 'password';"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-cocoa-400 hover:text-cocoa-600 text-xs">
              mostrar
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-cocoa-600">
            <input type="checkbox" class="rounded border-cocoa-200 text-cocoa-600 focus:ring-cocoa-400">
            Lembrar de mim
          </label>
          <a href="#" class="text-cocoa-600 hover:text-cocoa-800 font-medium">Esqueceu a senha?</a>
        </div>

        <button type="submit"
          class="w-full bg-cocoa-700 hover:bg-cocoa-800 transition-colors text-white text-sm font-medium py-3 rounded-lg shadow-sm">
          Entrar
        </button>
      </form>

      <!-- Rodapé do card -->
      <div class="mt-8 pt-6 border-t border-cocoa-200/60 text-center">
        <p class="text-sm text-cocoa-400">
          Não tem uma conta?
          <a href="#" class="text-cocoa-700 font-medium hover:underline">Fale com o administrador</a>
        </p>
      </div>

    </div>
  </div>

</body>
</html>
