<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar Novo Funcionário - DoceGestão</title>
  <!-- Esse é o CSS gerado pelo Tailwind CLI a partir do input.css -->
  <link rel="stylesheet" href="output.css" />
</head>
<body class="min-h-screen bg-[#FBF8F3] text-[#2B2118] flex">

  <!-- Sidebar -->
  <aside class="w-60 shrink-0 border-r border-[#EDE3D6] flex flex-col justify-between py-6">
    <div>
      <div class="px-6 pb-6 border-b border-[#EDE3D6]">
        <p class="font-semibold">Confeitaria</p>
        <p class="text-xs text-[#9C8D78]">Gestão Premium</p>
      </div>

      <nav class="mt-6 flex flex-col gap-1 px-3">
        <a href="#" class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm text-[#6B6153] hover:bg-[#F5F0E6]">
          Dashboard
        </a>
        <a href="#" class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm text-[#6B6153] hover:bg-[#F5F0E6]">
          Estoque
        </a>
        <a href="#" class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium bg-[#FBF3E7] text-[#8B5E34]">
          Admin
        </a>
      </nav>
    </div>

    <div class="px-3">
      <button type="button" class="w-full rounded-lg bg-[#3A2A1A] text-[#FBF8F3] text-sm font-medium py-2.5 hover:bg-[#2B2013]">
        + Novo Item
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col">

    <!-- Top bar -->
    <header class="flex items-center justify-between px-8 py-4 border-b border-[#EDE3D6]">
      <p class="text-lg font-semibold text-[#8B5E34]">DoceGestão</p>
      <div class="flex items-center gap-6 text-sm">
        <span class="text-[#9C8D78]">Dashboard</span>
        <span class="text-[#8B5E34] font-medium border-b-2 border-[#8B5E34] pb-1">Funcionários</span>
      </div>
    </header>

    <!-- Form -->
    <main class="flex-1 overflow-y-auto px-8 py-10">
      <form class="max-w-3xl mx-auto" action="#" method="POST">

        <div class="text-center mb-8">
          <h1 class="text-2xl font-semibold">Cadastrar Novo Funcionário</h1>
          <p class="text-sm text-[#9C8D78] mt-1">Preencha as informações para criar um novo acesso ao sistema.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-[220px_1fr] gap-5 mb-5">

          <!-- Foto -->
          <div class="rounded-xl border border-[#EDE3D6] bg-white p-6 flex flex-col items-center justify-center text-center py-8">
            <div id="preview-foto" class="w-20 h-20 rounded-full bg-[#F7D9DF] flex items-center justify-center mb-3 overflow-hidden bg-cover bg-center">
              <span class="text-[#C97A8E]">📷</span>
            </div>
            <p class="text-xs font-medium">UPLOAD DE FOTO</p>
            <p class="text-[11px] text-[#9C8D78] mt-1 px-4">Formatos JPG, PNG. Máx 2MB.</p>
            <input id="input-foto" type="file" name="foto" accept="image/png, image/jpeg" class="mt-3 text-xs" />
          </div>

          <!-- Dados pessoais -->
          <div class="rounded-xl border border-[#EDE3D6] bg-white p-6">
            <p class="text-sm font-semibold mb-5">Dados Pessoais</p>

            <label class="block">
              <span class="block text-xs font-medium mb-1.5">Nome completo</span>
              <input type="text" name="nome_completo" placeholder="Ex: Maria Oliveira"
                class="w-full rounded-lg border border-[#EDE3D6] bg-[#FBF8F3] px-3.5 py-2.5 text-sm placeholder:text-[#B5A891] focus:outline-none focus:ring-2 focus:ring-[#8B5E34]/30" />
            </label>

            <div class="grid grid-cols-2 gap-4 mt-4">
              <label class="block">
                <span class="block text-xs font-medium mb-1.5">CPF</span>
                <input type="text" name="cpf" placeholder="000.000.000-00"
                  class="w-full rounded-lg border border-[#EDE3D6] bg-[#FBF8F3] px-3.5 py-2.5 text-sm placeholder:text-[#B5A891] focus:outline-none focus:ring-2 focus:ring-[#8B5E34]/30" />
              </label>
              <label class="block">
                <span class="block text-xs font-medium mb-1.5">Idade</span>
                <input type="number" name="idade" placeholder="25"
                  class="w-full rounded-lg border border-[#EDE3D6] bg-[#FBF8F3] px-3.5 py-2.5 text-sm placeholder:text-[#B5A891] focus:outline-none focus:ring-2 focus:ring-[#8B5E34]/30" />
              </label>
            </div>
          </div>
        </div>

        <!-- Nível de acesso -->
        <div class="rounded-xl border border-[#EDE3D6] bg-white p-6 mb-5">
          <p class="text-sm font-semibold mb-5">Nível de Acesso</p>
          <div class="grid grid-cols-2 gap-4">

            <label id="opcao-administrador" class="nivel-acesso-opcao flex items-start gap-3 rounded-xl border border-[#D8B27E] bg-[#FBF3E7] p-4 cursor-pointer">
              <input type="radio" name="nivel_acesso" value="administrador" checked class="mt-1" />
              <div>
                <p class="text-sm font-medium">Administrador</p>
                <p class="text-xs text-[#9C8D78] mt-1">Acesso total ao sistema, relatórios financeiros e gestão de usuários.</p>
              </div>
            </label>

            <label id="opcao-funcionario" class="nivel-acesso-opcao flex items-start gap-3 rounded-xl border border-[#EDE3D6] bg-white p-4 cursor-pointer">
              <input type="radio" name="nivel_acesso" value="funcionario" class="mt-1" />
              <div>
                <p class="text-sm font-medium">Funcionário</p>
                <p class="text-xs text-[#9C8D78] mt-1">Acesso operacional: controle de estoque, entradas e saídas diárias.</p>
              </div>
            </label>

          </div>
        </div>

        <!-- Contato -->
        <div class="rounded-xl border border-[#EDE3D6] bg-white p-6 mb-5">
          <p class="text-sm font-semibold mb-5">Contato</p>
          <div class="grid grid-cols-2 gap-4">
            <label class="block">
              <span class="block text-xs font-medium mb-1.5">Email</span>
              <input type="email" name="email" placeholder="maria@confeitaria.com"
                class="w-full rounded-lg border border-[#EDE3D6] bg-[#FBF8F3] px-3.5 py-2.5 text-sm placeholder:text-[#B5A891] focus:outline-none focus:ring-2 focus:ring-[#8B5E34]/30" />
            </label>
            <label class="block">
              <span class="block text-xs font-medium mb-1.5">Telefone</span>
              <input type="text" name="telefone" placeholder="(00) 00000-0000"
                class="w-full rounded-lg border border-[#EDE3D6] bg-[#FBF8F3] px-3.5 py-2.5 text-sm placeholder:text-[#B5A891] focus:outline-none focus:ring-2 focus:ring-[#8B5E34]/30" />
            </label>
          </div>
        </div>

        <!-- Segurança -->
        <div class="rounded-xl border border-[#EDE3D6] bg-white p-6 mb-8">
          <p class="text-sm font-semibold mb-5">Segurança</p>
          <div class="grid grid-cols-2 gap-4">
            <label class="block">
              <span class="block text-xs font-medium mb-1.5">Senha</span>
              <input type="password" name="senha" placeholder="••••••••"
                class="w-full rounded-lg border border-[#EDE3D6] bg-[#FBF8F3] px-3.5 py-2.5 text-sm placeholder:text-[#B5A891] focus:outline-none focus:ring-2 focus:ring-[#8B5E34]/30" />
            </label>
            <label class="block">
              <span class="block text-xs font-medium mb-1.5">Confirmar senha</span>
              <input type="password" name="confirmar_senha" placeholder="••••••••"
                class="w-full rounded-lg border border-[#EDE3D6] bg-[#FBF8F3] px-3.5 py-2.5 text-sm placeholder:text-[#B5A891] focus:outline-none focus:ring-2 focus:ring-[#8B5E34]/30" />
            </label>
          </div>
        </div>

        <div class="flex justify-end gap-3">
          <button type="button" class="px-5 py-2.5 rounded-lg text-sm font-medium bg-[#F7D9DF] text-[#8B4A5C] hover:bg-[#F2C7D0]">
            Cancelar
          </button>
          <button type="submit" class="px-5 py-2.5 rounded-lg text-sm font-medium bg-[#8B5E34] text-white hover:bg-[#754D29]">
            Criar Conta
          </button>
        </div>

      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
